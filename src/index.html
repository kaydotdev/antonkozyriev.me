    <script>
      function getGreeting(timeZone) {
        try {
          const options = { hour: "numeric", hourCycle: "h23" };
          if (timeZone) options.timeZone = timeZone;

          const hour = parseInt(new Intl.DateTimeFormat("en-US", options).format(new Date()), 10);

          if (Number.isNaN(hour) || hour < 0 || hour > 23) return "Hi there,";
          if (hour >= 5 && hour < 12) return "Good morning,";
          if (hour >= 12 && hour < 18) return "Good afternoon,";

          return "Good evening,";
        } catch (e) {
          return "Hi there,";
        }
      }

      document.getElementById("greeting-title").textContent = getGreeting();

      Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0.02,
        minScale: 0.05,
        maxScale: 4,
        center: true,
        hash: true,
        controls: true,
        controlsTutorial: false,
        progress: true,
        transition: "slide",
        scrollActivationWidth: null,
